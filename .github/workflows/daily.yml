name: Spin Control Daily

on:
  # GitHub Actions cron is UTC and does not observe DST. Schedule both EST
  # (6:30 AM ET = 11:30 UTC) and EDT (6:30 AM ET = 10:30 UTC); run_all guards
  # against duplicate sends because nothing in `fetched`/`scored`/`drafted`
  # status will ship twice.
  schedule:
    - cron: "30 11 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Run ingest/score/draft but do not send the digest"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      DIGEST_EMAIL_BACKEND: ${{ vars.DIGEST_EMAIL_BACKEND || 'sendgrid' }}
      DIGEST_FROM: ${{ vars.DIGEST_FROM || 'spin-control@getlivewire.com' }}
      DIGEST_TO: ${{ vars.DIGEST_TO || 'henry@getlivewire.com' }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      SPIN_CONTROL_DB: spin_control.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite cache
        id: cache_db
        uses: actions/cache/restore@v4
        with:
          path: spin_control.db
          key: spin-control-db-v1-${{ github.run_id }}
          restore-keys: |
            spin-control-db-v1-

      - name: Run Spin Control
        run: |
          python main.py all ${{ github.event.inputs.skip_send == 'true' && '--skip-send' || '' }}

      - name: Save SQLite cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: spin_control.db
          key: spin-control-db-v1-${{ github.run_id }}
